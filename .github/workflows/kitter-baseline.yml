name: Kitter baseline

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/kitter-baseline.yml'
      - 'scripts/check-kitter-baseline.sh'
      - 'docs/upstream-baseline.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: what1f/kitter
          ref: 19711db044aabfa9846a65aaee693276d65af5c2
          path: upstream-kitter
          persist-credentials: false
      - name: Install Rust and native build prerequisites
        run: |
          rustup toolchain install 1.99 --profile minimal
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev
      - name: Test exact Kitter reference
        run: bash scripts/check-kitter-baseline.sh upstream-kitter
