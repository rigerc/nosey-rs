# Library profile — reusable library with a strict public API surface.
# Keeps: the renamed example lib and xtask; tests stay with the retained crate.
[metadata]
id = "library"
display_name = "Rust Library"
description = "Reusable library with strict public API and package checks."

[workspace]
include_crates = [
  "crates/example-crate",
  "crates/xtask",
]
exclude_paths = [
  "benchmarks",
  "fuzz",
  ".template",
  "docs/patterns",
  ".agents/skills/architecture-diagram",
  ".agents/skills/atomic-commit",
  ".agents/skills/beads",
  ".agents/skills/codacy",
  ".agents/skills/dora-report",
  ".agents/skills/gpui-actions",
  ".agents/skills/gpui-async",
  ".agents/skills/gpui-code-quality",
  ".agents/skills/gpui-elements",
  ".agents/skills/gpui-entities",
  ".agents/skills/gpui-fundamentals",
  ".agents/skills/gpui-init",
  ".agents/skills/gpui-kit",
  ".agents/skills/gpui-kit-design-guides",
  ".agents/skills/gpui-patterns",
  ".agents/skills/gpui-styling",
  ".agents/skills/gpui-testing",
  ".agents/skills/gpui-troubleshooting",
  ".agents/skills/hyprland",
  ".agents/skills/keytap-rust",
  ".agents/skills-optional/goap-agent",
  ".agents/skills/issue-triage",
  ".agents/skills/metrics-reporter",
  ".agents/skills-optional/self-fix-loop",
  ".agents/skills-optional/skill-creator",
  ".agents/skills-optional/skill-evaluator",
  ".agents/skills/stacked-prs",
  ".agents/skills-optional/task-decomposition",
  ".agents/skills/tokio-performance",
  ".agents/skills-optional/triz-analysis",
  ".agents/skills-optional/triz-solver",
]
exclude_workflows = [
  "cleanup-ci-status.yml",
  "deploy-docs.yml",
  "dora-fdrt.yml",
  "dora-report.yml",
  "eval.yml",
  "fuzz.yml",
  "labeler.yml",
  "mutants.yml",
  "patch-release-on-label.yml",
  "skills-evaluation.yml",
  "sync-labels.yml",
  "update-architecture-diagram.yml",
]

[ci]
default_tier = "protected-branch"

[policy]
lockfile = "ignored"
publish_packages = []

[post_init]
checklist = [
  "set-package-metadata",
  "configure-license-policy",
  "configure-branch-protection",
  "declare-public-api-surface",
]
